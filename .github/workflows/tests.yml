name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Installer les dépendances backend
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Lancer la suite de tests
        env:
          # Garde-fous avant mise en production (voir backend/.env.example) :
          # inoffensifs ici car chaque run part d'une base SQLite temporaire
          # jetée à la fin du job, jamais une vraie base de production.
          APP_ENV: development
          SEED_DEMO_USERS: "true"
          JWT_SECRET: ci-test-secret-not-for-production-use
        run: |
          python -m pytest tests/ -v
